[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nowork-bot-client"
version = "1.2.0"
description = "Minimal client for the NoWork Bot API (/api/bot/v1), used by framework plugins (NoneBot2)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "UNLICENSED" }
dependencies = [
    "httpx>=0.27,<0.28",
    "websockets>=12.0,<13.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0,<9.0", "pytest-asyncio>=0.23,<0.24"]

[tool.setuptools.packages.find]
include = ["nowork_bot_client*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
